name: Go

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laukpauk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # an empty database; the tests run the migrations on it
      TEST_DATABASE_URL: root:root@tcp(127.0.0.1:3306)/laukpauk_test
      # base64 of the seed users' password, which the first migration needs
      DEFAULT_PASSWORD: cGFzc3dvcmQ=
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - name: Install libwebp
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tidy modules
        run: |
          go mod tidy
          git diff go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Check go.mod and go.sum are tidy
        run: git diff --exit-code go.mod go.sum
