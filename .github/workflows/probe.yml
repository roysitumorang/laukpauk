name: probe
on:
  push:
    branches: [probe-uuid-api]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ef1b7a3ecd0acfdedd0d8de666c11c2b0a80a3a
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y libwebp-dev >/dev/null
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./controllers/ ./externals/ ./router/
      - run: go test -count=1 -v -run 'Whatsapp' ./controllers/ ./externals/
