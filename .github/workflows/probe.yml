name: probe
on:
  push:
    branches: [probe-uuid-api]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32b667b211d16cf940664eff8e0a61bf9aa212fb
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y libwebp-dev >/dev/null
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./externals/
      - run: go test -count=1 -v -run 'Whatsapp' ./externals/
